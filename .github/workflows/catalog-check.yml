name: Plus Model Catalog Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  catalog:
    name: Authenticated Plus catalog and rate freshness
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Compare authenticated catalog with bundled defaults
        run: npm run test:catalog
