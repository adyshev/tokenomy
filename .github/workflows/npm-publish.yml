name: NPM Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON
        run: npm run json:check

      - name: Verify generated configuration schema
        run: npm run schema:check

      - name: Run tests
        run: npm test

      - name: Typecheck against supported Pi API
        run: npm run typecheck

      - name: Test packed npm installation
        run: npm run test:package

      - name: Read package metadata
        id: package
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already published
        id: published
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select npm dist tag
        id: dist-tag
        run: |
          if [[ "${{ steps.package.outputs.version }}" == *-* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check npm token
        id: npm-token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NODE_AUTH_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.exists == 'false' && steps.npm-token.outputs.configured == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_args=(--access public --tag "${{ steps.dist-tag.outputs.tag }}")
          if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            publish_args+=(--provenance)
          else
            echo "::warning::GitHub OIDC identity token is unavailable; publishing without npm provenance."
          fi
          npm publish "${publish_args[@]}"

      - name: Skip missing npm token
        if: steps.published.outputs.exists == 'false' && steps.npm-token.outputs.configured == 'false'
        run: |
          echo "::warning::NPM_TOKEN is not configured. Add an npm automation token as a repository secret, then rerun this workflow."

      - name: Skip already published version
        if: steps.published.outputs.exists == 'true'
        run: echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published; skipping."

      - name: Verify package is available from npm
        id: verify
        if: steps.published.outputs.exists == 'true' || steps.npm-token.outputs.configured == 'true'
        run: |
          expected="${{ steps.package.outputs.version }}"
          actual=""
          for attempt in 1 2 3 4 5 6; do
            actual="$(npm view "${{ steps.package.outputs.name }}@$expected" version 2>/dev/null || true)"
            if [[ "$actual" = "$expected" ]]; then
              break
            fi
            echo "npm has not propagated $expected yet (attempt $attempt/6)"
            sleep $((attempt * 10))
          done
          test "$actual" = "$expected"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Sync latest while package is prerelease-only
        if: steps.verify.outputs.published == 'true' && steps.npm-token.outputs.configured == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package="${{ steps.package.outputs.name }}"
          version="${{ steps.package.outputs.version }}"
          if [[ "$version" != *-* ]]; then
            exit 0
          fi

          current_latest="$(npm view "$package@latest" version 2>/dev/null || true)"
          if [[ -n "$current_latest" && "$current_latest" != *-* ]]; then
            echo "Preserving stable npm latest at $current_latest."
            exit 0
          fi

          npm dist-tag add "$package@$version" latest
          test "$(npm view "$package@latest" version)" = "$version"

      - name: Create and push release tag
        if: steps.verify.outputs.published == 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

      - name: Create or update GitHub Release
        if: steps.verify.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="v$VERSION"
          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          else
            prerelease_args+=(--latest)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" "${prerelease_args[@]}" --title "$tag"
          else
            gh release create "$tag" --verify-tag --generate-notes "${prerelease_args[@]}" --title "$tag"
          fi
